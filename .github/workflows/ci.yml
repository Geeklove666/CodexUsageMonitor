name: macOS CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Validate metadata and packaging script
        run: |
          plutil -lint CodexUsageMonitor/Resources/Info.plist
          plutil -lint CodexUsageMonitor/Resources/PrivacyInfo.xcprivacy
          bash -n Scripts/package-dmg.sh
      - name: Build
        run: swift build
      - name: Test
        env:
          PACE_PREVIEW_DIR: ${{ runner.temp }}/pace-previews
        run: swift test
      - name: Upload quota forecast previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quota-forecast-previews
          path: ${{ runner.temp }}/pace-previews/*.png
          if-no-files-found: ignore
