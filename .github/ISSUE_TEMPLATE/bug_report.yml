name: Bug 报告
description: 报告可复现的错误或兼容性问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 请勿提交 Cookie、Token、邮箱、账户响应、提示词、回复或项目代码。
  - type: input
    id: version
    attributes:
      label: 应用版本
      placeholder: 例如 1.8.2 (25)
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS 与硬件
      placeholder: 例如 macOS 15.5, Apple Silicon
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: 数据来源
      options:
        - 本机 Codex
        - 应用内官方页面
        - 缓存或估算
        - 不确定或与数据无关
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 提供最小、可重复的操作步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已确认内容不包含登录凭据或私人账户数据
          required: true
